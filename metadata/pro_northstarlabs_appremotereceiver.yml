Name: App Remote Receiver
Summary: Receive APKs over your local network and install on TV
Description: |-
    App Remote Receiver runs on Fire TV and Android TV devices. It listens on
    your local network for paired APK uploads from App Remote Deploy, then shows
    an on-TV approval/install screen so you can install or update apps without
    waiting for an F-Droid repo refresh.

    Designed for private/home-network deployment and testing. No accounts. No ads.
    Keep the receiver on trusted networks only, and only approve APKs you trust.

