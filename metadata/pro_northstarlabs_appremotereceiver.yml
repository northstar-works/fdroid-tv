Name: App Remote Receiver
Summary: Receive APKs on Fire TV and Android TV for local app install approval
Description: |-
    App Remote Receiver runs on Fire TV and Android TV devices and listens on
    the local network for APK uploads from a paired App Remote sender.

    It is designed for private LAN deployment workflows. Send an APK from the
    Docker or desktop sender, approve it on the TV, then use the normal Android
    package installer to install or update the app.

