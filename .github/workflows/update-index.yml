name: Update F-Droid TV Index

on:
  push:
    branches: [ main ]
    paths:
      - 'repo/**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned F-Droid tools
        run: |
          python -m pip install --upgrade pip
          # Pin BOTH tools. androguard 4.x has a v2/v3 signature-block parser
          # bug (NoOverwriteDict.append) that crashes `fdroid update` on
          # v1+v2-signed APKs. 3.4.0a1 is the known-good version.
          python -m pip install "androguard==3.4.0a1" "fdroidserver==2.2.1"

      - name: Verify resolved versions (fail loudly if wrong)
        run: |
          set -e
          which fdroid
          fdroid --version
          AG_VER=$(python -c "import androguard; print(androguard.__version__)")
          echo "androguard version: $AG_VER"
          if [ "$AG_VER" != "3.4.0a1" ]; then
            echo "::error::androguard resolved to $AG_VER, expected 3.4.0a1. A 4.x version will crash fdroid update."
            exit 1
          fi

      - name: Verify APK signatures before F-Droid update
        run: |
          set -e
          for apk in repo/*.apk; do
            echo "Checking $apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Run fdroid update
        run: fdroid update --verbose

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add repo/ archive/ metadata/ || true

          if git diff --cached --quiet; then
            echo "Index unchanged, nothing to commit."
          else
            git commit -m "chore: regenerate F-Droid TV index"
            git push
          fi
